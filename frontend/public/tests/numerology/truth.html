<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진리의 서재 - 수비학 궁합 대전</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #D4AF37;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            color: #D4AF37;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .header p {
            color: #888;
            font-size: 0.9rem;
        }

        .back-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: 1px solid #D4AF37;
            color: #D4AF37;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: #D4AF37;
            color: #1a1a2e;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* 목차 뷰 */
        #library-view {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .combination-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .combination-card:hover {
            border-color: #D4AF37;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .combination-card.not-ready {
            opacity: 0.5;
        }

        .combination-card h3 {
            color: #D4AF37;
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .combination-card .concept {
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .combination-card .score {
            display: inline-block;
            background: linear-gradient(135deg, #D4AF37, #aa8a2e);
            color: #1a1a2e;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .parts-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .part-link {
            display: block;
            padding: 10px 15px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .part-link:hover {
            background: rgba(212, 175, 55, 0.3);
            color: #D4AF37;
        }

        .part-link.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .part-link .part-title {
            font-weight: bold;
        }

        .part-link .part-desc {
            font-size: 0.8rem;
            color: #888;
            margin-top: 3px;
        }

        /* 읽기 뷰 */
        #reader-view {
            display: none;
            max-width: 900px;
            margin: 0 auto;
        }

        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        .reader-nav {
            display: flex;
            gap: 10px;
        }

        .reader-nav button {
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid #D4AF37;
            color: #D4AF37;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .reader-nav button:hover {
            background: #D4AF37;
            color: #1a1a2e;
        }

        .reader-nav button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #content-area {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 40px;
            line-height: 1.9;
            font-size: 1.05rem;
        }

        #content-area h1 {
            color: #D4AF37;
            font-size: 2rem;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #D4AF37;
        }

        #content-area h2 {
            color: #D4AF37;
            font-size: 1.5rem;
            margin: 40px 0 20px;
        }

        #content-area h3 {
            color: #c9a227;
            font-size: 1.2rem;
            margin: 30px 0 15px;
        }

        #content-area p {
            margin-bottom: 15px;
        }

        #content-area blockquote {
            border-left: 4px solid #D4AF37;
            padding-left: 20px;
            margin: 20px 0;
            color: #ccc;
            font-style: italic;
            background: rgba(212, 175, 55, 0.05);
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
        }

        #content-area table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        #content-area th, #content-area td {
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 12px;
            text-align: left;
        }

        #content-area th {
            background: rgba(212, 175, 55, 0.2);
            color: #D4AF37;
        }

        #content-area code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }

        #content-area pre {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
        }

        #content-area pre code {
            background: none;
            padding: 0;
        }

        #content-area hr {
            border: none;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            margin: 40px 0;
        }

        #content-area ul, #content-area ol {
            margin: 15px 0;
            padding-left: 30px;
        }

        #content-area li {
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .close-reader {
            background: none;
            border: none;
            color: #D4AF37;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px 15px;
        }

        /* 섹션 구분 */
        .section-group {
            margin-bottom: 30px;
        }

        .section-title {
            color: #D4AF37;
            font-size: 1.5rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="back-btn">← 메인으로</a>
        <h1>진리의 서재</h1>
        <p>수비학 궁합 대전 - 신비주의 10가지 체계로 풀어낸 숫자들의 관계</p>
    </header>

    <div class="container">
        <!-- 목차 뷰 -->
        <div id="library-view"></div>

        <!-- 읽기 뷰 -->
        <div id="reader-view">
            <div class="reader-header">
                <button class="close-reader" onclick="closeReader()">← 목록으로</button>
                <div class="reader-nav">
                    <button id="prev-btn" onclick="navigate(-1)">◀ 이전</button>
                    <button id="next-btn" onclick="navigate(1)">다음 ▶</button>
                </div>
            </div>
            <div id="content-area">
                <div class="loading">불러오는 중...</div>
            </div>
        </div>
    </div>

    <script>
        // 조합 데이터 정의
        const combinations = [
            // 1-X 조합
            { id: '1-1', name: '1-1', concept: '두 태양의 왕국', score: 95, parts: 4, ready: true },
            { id: '1-2', name: '1-2', concept: '태양과 달의 조화', score: 95, parts: 4, ready: true },
            { id: '1-3', name: '1-3', concept: '비전과 표현의 결합', score: 95, parts: 4, ready: true },
            { id: '1-4', name: '1-4', concept: '현자의 돌', score: 95, parts: 4, ready: true },
            { id: '1-5', name: '1-5', concept: '비상의 연금술', score: 95, parts: 4, ready: true },
            { id: '1-6', name: '1-6', concept: '에덴의 재창조', score: 95, parts: 4, ready: true },
            { id: '1-7', name: '1-7', concept: '왕관과 성배', score: 95, parts: 4, ready: true },
            { id: '1-8', name: '1-8', concept: '무한의 제국', score: 95, parts: 4, ready: true },
            { id: '1-9', name: '1-9', concept: '시작과 완성', score: null, parts: 0, ready: false },

            // 2-X 조합
            { id: '2-2', name: '2-2', concept: '거울의 호수', score: null, parts: 0, ready: false },
            { id: '2-3', name: '2-3', concept: '조화로운 표현', score: null, parts: 0, ready: false },
            { id: '2-4', name: '2-4', concept: '안정의 기반', score: null, parts: 0, ready: false },
            { id: '2-5', name: '2-5', concept: '균형과 자유', score: null, parts: 0, ready: false },
            { id: '2-6', name: '2-6', concept: '사랑의 이중주', score: null, parts: 0, ready: false },
            { id: '2-7', name: '2-7', concept: '직관의 다리', score: 90, parts: 4, ready: true },
            { id: '2-8', name: '2-8', concept: '부와 조화', score: 90, parts: 4, ready: true },
            { id: '2-9', name: '2-9', concept: '봉사의 완성', score: 90, parts: 4, ready: true },

            // 3-X 조합
            { id: '3-3', name: '3-3', concept: '창조의 폭발', score: 90, parts: 4, ready: true },
            { id: '3-4', name: '3-4', concept: '상상의 건축', score: 90, parts: 4, ready: true },
            { id: '3-5', name: '3-5', concept: '자유로운 표현', score: 90, parts: 4, ready: true },
            { id: '3-6', name: '3-6', concept: '예술적 돌봄', score: 90, parts: 4, ready: true },
            { id: '3-7', name: '3-7', concept: '신비로운 창조', score: 90, parts: 4, ready: true },
            { id: '3-8', name: '3-8', concept: '풍요의 표현', score: 90, parts: 4, ready: true },
            { id: '3-9', name: '3-9', concept: '우주적 창조', score: 90, parts: 4, ready: true },

            // 4-X 조합
            { id: '4-4', name: '4-4', concept: '견고한 성채', score: 90, parts: 4, ready: true },
            { id: '4-5', name: '4-5', concept: '구조와 자유', score: 90, parts: 4, ready: true },
            { id: '4-6', name: '4-6', concept: '가정의 기반', score: 90, parts: 4, ready: true },
            { id: '4-7', name: '4-7', concept: '실용적 지혜', score: 90, parts: 4, ready: true },
            { id: '4-8', name: '4-8', concept: '물질의 제국', score: 90, parts: 4, ready: true },
            { id: '4-9', name: '4-9', concept: '구축의 완성', score: 90, parts: 4, ready: true },

            // 5-X 조합
            { id: '5-5', name: '5-5', concept: '이중 자유', score: null, parts: 0, ready: false },
            { id: '5-6', name: '5-6', concept: '자유와 책임', score: null, parts: 0, ready: false },
            { id: '5-7', name: '5-7', concept: '탐험과 탐구', score: null, parts: 0, ready: false },
            { id: '5-8', name: '5-8', concept: '역동적 성공', score: null, parts: 0, ready: false },
            { id: '5-9', name: '5-9', concept: '자유로운 봉사', score: null, parts: 0, ready: false },

            // 6-X 조합
            { id: '6-6', name: '6-6', concept: '사랑의 성전', score: null, parts: 0, ready: false },
            { id: '6-7', name: '6-7', concept: '돌봄과 지혜', score: null, parts: 0, ready: false },
            { id: '6-8', name: '6-8', concept: '가정과 성공', score: null, parts: 0, ready: false },
            { id: '6-9', name: '6-9', concept: '인류애의 봉사', score: null, parts: 0, ready: false },

            // 7-X 조합
            { id: '7-7', name: '7-7', concept: '심연의 거울', score: null, parts: 0, ready: false },
            { id: '7-8', name: '7-8', concept: '영적 풍요', score: null, parts: 0, ready: false },
            { id: '7-9', name: '7-9', concept: '지혜의 완성', score: null, parts: 0, ready: false },

            // 8-X 조합
            { id: '8-8', name: '8-8', concept: '무한의 제국', score: null, parts: 0, ready: false },
            { id: '8-9', name: '8-9', concept: '권력과 완성', score: null, parts: 0, ready: false },

            // 9-9 조합
            { id: '9-9', name: '9-9', concept: '완성의 완성', score: null, parts: 0, ready: false },
        ];

        const partInfo = [
            { num: 1, title: 'Part 1: 신비주의 체계', desc: '10가지 신비주의 체계 분석' },
            { num: 2, title: 'Part 2: 카르마 이야기', desc: '3개 시대의 전생 스토리' },
            { num: 3, title: 'Part 3: 관계 유형', desc: '동료, 친구, 가족, 연인, 부부' },
            { num: 4, title: 'Part 4: 최종 평가', desc: '종합 점수 및 실천 가이드' },
        ];

        let currentCombination = null;
        let currentPart = 1;

        // 목차 렌더링
        function renderLibrary() {
            const container = document.getElementById('library-view');
            let html = '';

            // 섹션별로 그룹화
            const sections = {
                '1-X 조합': combinations.filter(c => c.id.startsWith('1-')),
                '2-X 조합': combinations.filter(c => c.id.startsWith('2-')),
                '3-X 조합': combinations.filter(c => c.id.startsWith('3-')),
                '4-X 조합': combinations.filter(c => c.id.startsWith('4-')),
                '5-X 조합': combinations.filter(c => c.id.startsWith('5-')),
                '6-X 조합': combinations.filter(c => c.id.startsWith('6-')),
                '7-X 조합': combinations.filter(c => c.id.startsWith('7-')),
                '8-X 조합': combinations.filter(c => c.id.startsWith('8-')),
                '9-X 조합': combinations.filter(c => c.id.startsWith('9-')),
            };

            for (const [sectionName, items] of Object.entries(sections)) {
                if (items.length === 0) continue;

                html += `<div class="section-group">`;
                html += `<h2 class="section-title">${sectionName}</h2>`;
                html += `<div class="section-cards">`;

                for (const combo of items) {
                    html += `
                        <div class="combination-card ${combo.ready ? '' : 'not-ready'}">
                            <h3>${combo.name} 조합</h3>
                            <div class="concept">"${combo.concept}"</div>
                            ${combo.score ? `<div class="score">${combo.score}점</div>` : '<div class="score" style="background:#666;">준비중</div>'}
                            <div class="parts-list">
                                ${partInfo.map(p => `
                                    <div class="part-link ${combo.ready && p.num <= combo.parts ? '' : 'disabled'}"
                                         onclick="${combo.ready && p.num <= combo.parts ? `openReader('${combo.id}', ${p.num})` : ''}">
                                        <div class="part-title">${p.title}</div>
                                        <div class="part-desc">${p.desc}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                html += `</div></div>`;
            }

            container.innerHTML = html;
        }

        // 리더 열기
        async function openReader(comboId, partNum) {
            currentCombination = comboId;
            currentPart = partNum;

            document.getElementById('library-view').style.display = 'none';
            document.getElementById('reader-view').style.display = 'block';

            await loadContent(comboId, partNum);
            updateNavButtons();
        }

        // 리더 닫기
        function closeReader() {
            document.getElementById('library-view').style.display = 'grid';
            document.getElementById('reader-view').style.display = 'none';
            currentCombination = null;
            currentPart = 1;
        }

        // 콘텐츠 로드
        async function loadContent(comboId, partNum) {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<div class="loading">불러오는 중...</div>';

            const filename = `numerology-${comboId}-part${partNum}.md`;

            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('파일 없음');

                const markdown = await response.text();
                contentArea.innerHTML = marked.parse(markdown);
            } catch (error) {
                contentArea.innerHTML = `
                    <div style="text-align:center; padding:50px; color:#888;">
                        <h2>콘텐츠를 불러올 수 없습니다</h2>
                        <p>파일: ${filename}</p>
                        <p style="margin-top:20px;">${error.message}</p>
                    </div>
                `;
            }
        }

        // 네비게이션
        function navigate(direction) {
            const newPart = currentPart + direction;
            if (newPart >= 1 && newPart <= 4) {
                currentPart = newPart;
                loadContent(currentCombination, currentPart);
                updateNavButtons();
            }
        }

        function updateNavButtons() {
            document.getElementById('prev-btn').disabled = currentPart <= 1;
            document.getElementById('next-btn').disabled = currentPart >= 4;
        }

        // 초기화
        renderLibrary();
    </script>
</body>
</html>
