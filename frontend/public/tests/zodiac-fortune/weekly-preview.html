<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간운세 미리보기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            /* 단어 잘림 방지 */
            word-break: keep-all;
            overflow-wrap: break-word;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 22px;
            margin-bottom: 10px;
            word-break: keep-all;
        }
        .header .period {
            font-size: 16px;
            opacity: 0.9;
        }
        .section {
            padding: 25px;
            border-bottom: 1px solid #eee;
        }
        .section:last-child {
            border-bottom: none;
        }
        .section h2 {
            color: #1976d2;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: keep-all;
        }
        .section h3 {
            color: #424242;
            font-size: 16px;
            margin-bottom: 10px;
            word-break: keep-all;
        }
        .score-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b, #ffa502);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .description {
            line-height: 1.8;
            color: #555;
            font-size: 15px;
            word-break: keep-all;
        }
        .theme-box {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            padding: 20px;
            border-radius: 12px;
            margin-top: 10px;
        }
        .theme-keyword {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .fortune-areas {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        @media (max-width: 600px) {
            .fortune-areas {
                grid-template-columns: 1fr;
            }
        }
        .area-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #1976d2;
        }
        .area-card h4 {
            color: #1976d2;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            word-break: keep-all;
        }
        .area-score {
            background: #1976d2;
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            flex-shrink: 0;
        }
        .area-card .flow {
            font-size: 14px;
            color: #666;
            line-height: 1.7;
            margin-bottom: 10px;
            word-break: keep-all;
        }
        .area-card .key-point {
            font-size: 13px;
            color: #1976d2;
            background: #e3f2fd;
            padding: 10px;
            border-radius: 5px;
            word-break: keep-all;
        }
        .weekly-summary {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            padding: 20px;
            border-radius: 12px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        @media (max-width: 600px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
        }
        .summary-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #ff9800;
        }
        .summary-item .label {
            font-size: 12px;
            color: #e65100;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .summary-item .value {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            word-break: keep-all;
        }
        .tips-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        @media (max-width: 600px) {
            .tips-grid {
                grid-template-columns: 1fr;
            }
        }
        .tips-do {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            padding: 15px;
            border-radius: 10px;
        }
        .tips-dont {
            background: linear-gradient(135deg, #ffebee, #ffcdd2);
            padding: 15px;
            border-radius: 10px;
        }
        .tips-do h4 {
            color: #2e7d32;
            margin-bottom: 10px;
        }
        .tips-dont h4 {
            color: #c62828;
            margin-bottom: 10px;
        }
        .tips-list {
            list-style: none;
        }
        .tips-list li {
            padding: 6px 0;
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            word-break: keep-all;
        }
        .tips-do .tips-list li::before {
            content: "✓ ";
            color: #2e7d32;
            font-weight: bold;
        }
        .tips-dont .tips-list li::before {
            content: "✗ ";
            color: #c62828;
            font-weight: bold;
        }
        .lucky-items {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .lucky-item {
            background: linear-gradient(135deg, #e1f5fe, #b3e5fc);
            padding: 12px 18px;
            border-radius: 25px;
            text-align: center;
        }
        .lucky-item .label {
            font-size: 11px;
            color: #666;
        }
        .lucky-item .value {
            font-weight: bold;
            color: #0277bd;
            font-size: 14px;
            word-break: keep-all;
        }
        .affirmation {
            background: linear-gradient(135deg, #ede7f6, #d1c4e9);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 16px;
            color: #512da8;
            line-height: 1.7;
            font-style: italic;
            word-break: keep-all;
        }
        .char-count {
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
            font-size: 14px;
            color: #666;
            border-radius: 0 0 20px 20px;
        }
        .daily-link {
            text-align: center;
            padding: 15px;
            background: #f0f0f0;
        }
        .daily-link a {
            color: #1976d2;
            text-decoration: none;
            font-size: 14px;
        }
        .daily-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container" id="fortune-container">
        <!-- 동적 로드 -->
    </div>

    <script>
        async function loadFortune() {
            try {
                const response = await fetch('data/fortune/daily_weekly/rat_1984_male_weekly_dec_w1.json');
                const data = await response.json();
                renderFortune(data);
                countCharacters(data);
            } catch (error) {
                console.error('로드 실패:', error);
                document.getElementById('fortune-container').innerHTML = '<p style="padding:20px;text-align:center;">데이터 로드 실패</p>';
            }
        }

        function renderFortune(data) {
            const c = data.content;

            let html = `
                <div class="header">
                    <h1>${data.title}</h1>
                    <div class="period">${data.period}</div>
                </div>

                <div class="section">
                    <h2>📊 ${c.overview.title}</h2>
                    <div style="margin-bottom: 12px;">
                        <span class="score-badge">이번 주 ${c.overview.score}점</span>
                    </div>
                    <p class="description">${c.overview.description}</p>
                </div>

                <div class="section">
                    <h2>🎯 ${c.weekly_theme.title}</h2>
                    <div class="theme-box">
                        <span class="theme-keyword">${c.weekly_theme.keyword}</span>
                        <p class="description">${c.weekly_theme.description}</p>
                    </div>
                </div>

                <div class="section">
                    <h2>📈 영역별 운세</h2>
                    <div class="fortune-areas">
                        <div class="area-card">
                            <h4>💼 ${c.fortune_areas.work.title} <span class="area-score">${c.fortune_areas.work.score}점</span></h4>
                            <p class="flow">${c.fortune_areas.work.weekly_flow}</p>
                            <p class="key-point">💡 ${c.fortune_areas.work.key_point}</p>
                        </div>
                        <div class="area-card">
                            <h4>👥 ${c.fortune_areas.relationships.title} <span class="area-score">${c.fortune_areas.relationships.score}점</span></h4>
                            <p class="flow">${c.fortune_areas.relationships.weekly_flow}</p>
                            <p class="key-point">💡 ${c.fortune_areas.relationships.key_point}</p>
                        </div>
                        <div class="area-card">
                            <h4>❤️ ${c.fortune_areas.health.title} <span class="area-score">${c.fortune_areas.health.score}점</span></h4>
                            <p class="flow">${c.fortune_areas.health.weekly_flow}</p>
                            <p class="key-point">💡 ${c.fortune_areas.health.key_point}</p>
                        </div>
                        <div class="area-card">
                            <h4>💰 ${c.fortune_areas.wealth.title} <span class="area-score">${c.fortune_areas.wealth.score}점</span></h4>
                            <p class="flow">${c.fortune_areas.wealth.weekly_flow}</p>
                            <p class="key-point">💡 ${c.fortune_areas.wealth.key_point}</p>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>📅 ${c.weekly_summary.title}</h2>
                    <div class="weekly-summary">
                        <div class="summary-grid">
                            <div class="summary-item">
                                <div class="label">월~화</div>
                                <div class="value">${c.weekly_summary.mon_tue}</div>
                            </div>
                            <div class="summary-item">
                                <div class="label">수~목</div>
                                <div class="value">${c.weekly_summary.wed_thu}</div>
                            </div>
                            <div class="summary-item">
                                <div class="label">금요일</div>
                                <div class="value">${c.weekly_summary.fri}</div>
                            </div>
                            <div class="summary-item">
                                <div class="label">주말</div>
                                <div class="value">${c.weekly_summary.weekend}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>💡 이번 주 팁</h2>
                    <div class="tips-grid">
                        <div class="tips-do">
                            <h4>이렇게 하세요</h4>
                            <ul class="tips-list">
                                ${c.weekly_tips.do.map(tip => `<li>${tip}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="tips-dont">
                            <h4>이건 피하세요</h4>
                            <ul class="tips-list">
                                ${c.weekly_tips.dont.map(tip => `<li>${tip}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>🍀 행운 아이템</h2>
                    <div class="lucky-items">
                        <div class="lucky-item">
                            <div class="label">색상</div>
                            <div class="value">${c.lucky_items.color}</div>
                        </div>
                        <div class="lucky-item">
                            <div class="label">숫자</div>
                            <div class="value">${c.lucky_items.number}</div>
                        </div>
                        <div class="lucky-item">
                            <div class="label">방향</div>
                            <div class="value">${c.lucky_items.direction}</div>
                        </div>
                        <div class="lucky-item">
                            <div class="label">아이템</div>
                            <div class="value">${c.lucky_items.item}</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="affirmation">
                        "${c.affirmation}"
                    </div>
                </div>

                <div class="daily-link">
                    <a href="#">📖 각 요일별 상세 운세는 일간운세에서 확인하세요</a>
                </div>

                <div class="char-count" id="char-count"></div>
            `;

            document.getElementById('fortune-container').innerHTML = html;
        }

        function countCharacters(data) {
            const jsonStr = JSON.stringify(data, null, 2);
            const contentStr = JSON.stringify(data.content);

            // 텍스트만 추출
            let textOnly = '';
            function extractText(obj) {
                for (const key in obj) {
                    if (typeof obj[key] === 'string') {
                        textOnly += obj[key] + ' ';
                    } else if (Array.isArray(obj[key])) {
                        obj[key].forEach(item => {
                            if (typeof item === 'string') textOnly += item + ' ';
                        });
                    } else if (typeof obj[key] === 'object') {
                        extractText(obj[key]);
                    }
                }
            }
            extractText(data.content);

            document.getElementById('char-count').innerHTML = `
                <strong>글자수 분석</strong><br>
                JSON 전체: ${jsonStr.length.toLocaleString()} bytes |
                순수 텍스트: ${textOnly.length.toLocaleString()}자
            `;
        }

        loadFortune();
    </script>
</body>
</html>
